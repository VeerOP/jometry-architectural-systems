<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="Plan section through the service wall showing panel, standoff, cavity with cable rails and substrate">
  <defs>
    <pattern id="sub" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#bfc5cc" stroke-width="1"/>
    </pattern>
    <marker id="dm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 5L9 2M0 5L9 8" fill="none" stroke="#868d97" stroke-width="1"/>
    </marker>
  </defs>
  <!-- substrate -->
  <rect x="248" y="20" width="22" height="276" fill="url(#sub)" stroke="#bfc5cc" stroke-width=".6"/>
  <!-- cavity -->
  <rect x="168" y="20" width="80" height="276" fill="#eef1f4" stroke="#d8dce1" stroke-width=".6"/>
  <!-- rails -->
  <rect x="196" y="70" width="46" height="8" fill="#dfe4e9" stroke="#5a6472" stroke-width=".6"/>
  <rect x="196" y="160" width="46" height="8" fill="#dfe4e9" stroke="#5a6472" stroke-width=".6"/>
  <rect x="196" y="250" width="46" height="8" fill="#dfe4e9" stroke="#5a6472" stroke-width=".6"/>
  <!-- cables -->
  <g stroke="#1d5b8f" stroke-width="2.2" fill="none">
    <path d="M180 60 C 210 60, 214 92, 240 92"/>
    <path d="M180 68 C 214 68, 218 100, 240 100"/>
  </g>
  <g stroke="#a86a1f" stroke-width="2.2" fill="none">
    <path d="M180 150 C 212 150, 216 182, 240 182"/>
  </g>
  <g stroke="#5a6472" stroke-width="2.6" fill="none">
    <path d="M180 240 C 212 240, 216 272, 240 272"/>
  </g>
  <!-- mounting node -->
  <rect x="216" y="112" width="32" height="26" fill="#e4e9ee" stroke="#1d5b8f" stroke-width=".8"/>
  <!-- panel -->
  <rect x="128" y="20" width="40" height="276" fill="#fff" stroke="#12151a" stroke-width=".9"/>
  <g fill="#f1f3f5" stroke="#12151a" stroke-width=".5">
    <rect x="128" y="24" width="40" height="42"/><rect x="128" y="72" width="40" height="42"/>
    <rect x="128" y="120" width="40" height="42"/><rect x="128" y="168" width="40" height="42"/>
    <rect x="128" y="216" width="40" height="42"/><rect x="128" y="264" width="40" height="28"/>
  </g>
  <!-- outlet in face -->
  <rect x="120" y="176" width="12" height="26" fill="#fff" stroke="#12151a" stroke-width=".8"/>
  <line x1="132" y1="189" x2="180" y2="189" stroke="#1d5b8f" stroke-width="1.6" stroke-dasharray="3 3"/>
  <!-- dims -->
  <line x1="168" y1="312" x2="248" y2="312" stroke="#868d97" stroke-width=".8" marker-start="url(#dm)" marker-end="url(#dm)"/>
  <text x="208" y="328" font-family="IBM Plex Mono, monospace" font-size="9" fill="#464c55" text-anchor="middle">adjustable standoff</text>
  <text x="208" y="42" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#868d97" text-anchor="middle">service cavity</text>
  <text x="60" y="196" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#12151a">outlet in panel face</text>
  <text x="60" y="128" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#1d5b8f">demountable panel</text>
</svg>
