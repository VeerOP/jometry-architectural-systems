<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" role="img" aria-label="Cassette cross-section showing planted face, growing medium, sealed body, ventilated cavity and drainage">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a6a3b" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <pattern id="hx" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c4c0b6" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- structure -->
  <rect x="256" y="20" width="18" height="330" fill="url(#hx)" stroke="#c4c0b6" stroke-width=".6"/>
  <!-- cavity -->
  <rect x="214" y="20" width="42" height="330" fill="#f2f4f0" stroke="#dedbd3" stroke-width=".6"/>
  <!-- rail -->
  <rect x="222" y="150" width="26" height="34" fill="#e3ded2" stroke="#c8bfa8" stroke-width=".6"/>
  <!-- cassette body -->
  <rect x="60" y="20" width="154" height="330" fill="#fff" stroke="#141613" stroke-width=".9"/>
  <!-- rear waterproof face -->
  <rect x="204" y="20" width="10" height="330" fill="#dfe6d8" stroke="#3d5a2c" stroke-width=".6"/>
  <!-- medium -->
  <rect x="72" y="46" width="132" height="252" fill="#f0ede4" stroke="#dedbd3" stroke-width=".6"/>
  <!-- front face -->
  <rect x="60" y="20" width="12" height="330" fill="#efeee9" stroke="#141613" stroke-width=".7"/>
  <!-- reservoir / drain -->
  <rect x="72" y="298" width="132" height="34" fill="#e4ecf3" stroke="#7a9ec0" stroke-width=".6"/>
  <line x1="72" y1="298" x2="204" y2="298" stroke="#7a9ec0" stroke-width="1.1" stroke-dasharray="5 3"/>
  <!-- top weir -->
  <rect x="72" y="26" width="132" height="16" fill="#e4ecf3" stroke="#7a9ec0" stroke-width=".6"/>
  <!-- plants -->
  <g stroke="#3d5a2c" stroke-width="1.6" fill="#3d5a2c">
    <circle cx="66" cy="80" r="4"/><circle cx="66" cy="150" r="4"/><circle cx="66" cy="220" r="4"/><circle cx="66" cy="284" r="4"/>
    <line x1="60" y1="80" x2="34" y2="68"/><ellipse cx="31" cy="66" rx="8" ry="4"/>
    <line x1="60" y1="150" x2="34" y2="138"/><ellipse cx="31" cy="136" rx="8" ry="4"/>
    <line x1="60" y1="220" x2="34" y2="208"/><ellipse cx="31" cy="206" rx="8" ry="4"/>
    <line x1="60" y1="284" x2="34" y2="272"/><ellipse cx="31" cy="270" rx="8" ry="4"/>
  </g>
  <!-- water arrows -->
  <line x1="138" y1="6" x2="138" y2="24" stroke="#7a9ec0" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="120" y1="60" x2="120" y2="290" stroke="#7a9ec0" stroke-width="1.4" stroke-dasharray="2 6"/>
  <line x1="170" y1="290" x2="170" y2="60" stroke="#7a9ec0" stroke-width="1.4" stroke-dasharray="2 6"/>
  <path d="M204 322 L232 322 L232 350" fill="none" stroke="#7a9ec0" stroke-width="1.8"/>
  <!-- air arrows -->
  <path d="M20 175 C 90 175, 170 175, 210 175 S 236 175, 236 120" fill="none" stroke="#8a6a3b" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#ar)"/>
</svg>
